    <script>
      // Gracefully silence harmless Vite HMR WebSocket disconnects in iframe/preview environments
      (function() {
        const _origError = console.error;
        console.error = function(...args) {
          const str = args.map(a => String(a?.message || a || '')).join(' ');
          if (str.includes('[vite]') || str.includes('WebSocket') || str.includes('websocket')) {
            return;
          }
          _origError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          const str = String(event.reason?.message || event.reason || '');
          if (str.includes('WebSocket') || str.includes('websocket') || str.includes('vite')) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
        window.addEventListener('error', function(event) {
          const str = String(event.message || event.error?.message || '');
          if (str.includes('WebSocket') || str.includes('websocket') || str.includes('vite')) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
