<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14244D" />
      <stop offset="45%" stop-color="#0A142D" />
      <stop offset="85%" stop-color="#050A17" />
      <stop offset="100%" stop-color="#02050D" />
    </radialGradient>

    <radialGradient id="coreGlowEmerald" cx="50%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050A17" stop-opacity="0" />
    </radialGradient>

    <!-- Luxury Gold Linear Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>

    <linearGradient id="goldDark" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78590F" />
      <stop offset="35%" stop-color="#AA820A" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Filters -->
    <filter id="lockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
    <filter id="outerRingShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="1080" fill="url(#bgGlow)" />

  <!-- Center Ambient Radiant Flare -->
  <circle cx="540" cy="540" r="440" fill="url(#coreGlowEmerald)" />

  <!-- Outer Decorative Rings for Instagram Story Highlights -->
  <circle cx="540" cy="540" r="390" fill="none" stroke="url(#goldLight)" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6 6" />
  <circle cx="540" cy="540" r="360" fill="none" stroke="url(#goldLight)" stroke-width="5" filter="url(#outerRingShadow)" />
  <circle cx="540" cy="540" r="340" fill="none" stroke="url(#goldDark)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Protective Heraldic Shield Outline (Behind Lock) -->
  <path
    d="M 540 250 Q 690 260 740 330 Q 740 560 540 760 Q 340 560 340 330 Q 390 260 540 250 Z"
    fill="#081126"
    stroke="url(#goldDark)"
    stroke-width="3"
    opacity="0.85"
  />

  <!-- MAIN 3D LUXURY PADLOCK -->
  <g filter="url(#lockGlow)">
    <!-- Padlock Heavy Shackle (Anse du cadenas) -->
    <path
      d="M 420 480 L 420 370 C 420 300 470 250 540 250 C 610 250 660 300 660 370 L 660 480"
      fill="none"
      stroke="url(#goldLight)"
      stroke-width="48"
      stroke-linecap="round"
    />
    <!-- Shackle Inset Metallic Highlight -->
    <path
      d="M 420 480 L 420 370 C 420 300 470 250 540 250 C 610 250 660 300 660 370 L 660 480"
      fill="none"
      stroke="#FFFDEB"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.6"
    />

    <!-- Padlock Solid Heavy Body (Corps du cadenas) -->
    <rect
      x="350"
      y="470"
      width="380"
      height="300"
      rx="40"
      fill="#0B1636"
      stroke="url(#goldLight)"
      stroke-width="12"
    />

    <!-- Inner Metallic Bevel -->
    <rect
      x="372"
      y="492"
      width="336"
      height="256"
      rx="24"
      fill="none"
      stroke="url(#goldDark)"
      stroke-width="4"
    />

    <!-- Front Emblem: Security Keyhole with Shield Center -->
    <g transform="translate(0, 20)">
      <!-- Keyhole Circle -->
      <circle cx="540" cy="580" r="38" fill="url(#goldLight)" />
      <!-- Keyhole Lower Triangle Slot -->
      <polygon points="522,596 558,596 564,660 516,660" fill="url(#goldLight)" />

      <!-- Inner Void (Deep Navy/Black) -->
      <circle cx="540" cy="580" r="24" fill="#040817" />
      <polygon points="528,590 552,590 556,648 524,648" fill="#040817" />

      <!-- Glowing Green Security Status Dot inside Keyhole -->
      <circle cx="540" cy="580" r="9" fill="#10B981" />
    </g>
  </g>

  <!-- RGPD & Data Privacy Tag Banner in Bottom Arc -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <!-- Mini pill tag at bottom -->
    <rect x="420" y="795" width="240" height="42" rx="21" fill="#081126" stroke="url(#goldLight)" stroke-width="2" />
    <text x="540" y="822" font-size="15" font-weight="bold" fill="url(#goldLight)" letter-spacing="2">
      🔒 100% CONFIDENTIEL
    </text>
  </g>

  <!-- Sparkle Glints -->
  <g fill="#FFFDEB" opacity="0.95">
    <path d="M 660 300 Q 660 285 665 285 Q 660 285 660 270 Q 660 285 655 285 Q 660 285 660 300 Z" />
    <circle cx="660" cy="285" r="4" fill="#FFFFFF" />
  </g>
</svg>
